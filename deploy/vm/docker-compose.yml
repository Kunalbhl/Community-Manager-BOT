# Community Manager — always-on bot engine on the Oracle Always Free VM.
# Runs next to SocialCord's container; shares nothing with it except the machine.
name: community-manager
services:
  bot:
    build:
      context: ../..
      dockerfile: deploy/vm/Dockerfile.bot
    image: community-manager-bot:latest
    container_name: community-manager-bot
    restart: unless-stopped
    env_file:
      - /opt/community-manager/bot.env
    environment:
      NODE_ENV: production
      APP_RUNTIME_MODE: PRODUCTION
      BOT_INSTANCE_ROLE: vm
      BOT_LEADER_PRIORITY: "100"
      BOT_ENABLED: "true"
      DB_POOL_MAX: "4"
      PORT: "3000"
      GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:3101:3000"   # local health checks only; never exposed publicly
    mem_limit: 450m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/live"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # HTTPS front door so the website on Cloud Run can forward API calls to the active bot.
  # Free automatic certificate for <vm-ip-with-dashes>.sslip.io.
  caddy:
    image: caddy:2-alpine
    container_name: community-manager-caddy
    restart: unless-stopped
    depends_on: [bot]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_API_HOST: 137-23-46-177.sslip.io
    command: ["sh", "-c", "caddy reverse-proxy --from \"$${PUBLIC_API_HOST}\" --to bot:3000"]
    volumes:
      - caddy-data:/data
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  caddy-data:
