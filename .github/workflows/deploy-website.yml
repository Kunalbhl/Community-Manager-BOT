name: Deploy website (Cloud Run)

# Every merge to main redeploys the website to the same Cloud Run service and URL.
# The Discord bot itself runs on the Oracle VM, which updates itself from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/720940628402/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@community-manager-bot-508316.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy with Cloud Build
        run: |
          gcloud builds submit --project=community-manager-bot-508316 --region=asia-southeast1 \
            --config=cloudbuild.yaml --substitutions=_TAG=${GITHUB_SHA::7} .
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -sf https://community-manager.chaloone.com/health/live && exit 0; sleep 6
          done
          echo "::error::Website did not become healthy"; exit 1
