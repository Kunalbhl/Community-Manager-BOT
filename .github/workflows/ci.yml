name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cm
          POSTGRES_PASSWORD: cm
          POSTGRES_DB: cm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cm -d cm_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check (app code)
        shell: bash
        run: |
          npx tsc --noEmit -p . > tsc.log 2>&1 || true
          if grep -E '^(server|src|shared|server\.ts).*error TS' tsc.log; then
            echo "::error::TypeScript errors in app code"; exit 1
          fi
      - name: Database layer (real Postgres)
        env:
          TEST_DATABASE_URL: postgresql://cm:cm@localhost:5432/cm_test
        run: npx tsx test/postgres-store.test.ts && npx tsx test/reminders.test.ts
      - name: Google sign-in security
        run: npx tsx test/google-api.test.ts
      - name: Legacy test suite (report only)
        continue-on-error: true
        shell: bash
        run: |
          set +e; npx tsx test/run-tests.ts > legacy-tests.log 2>&1; code=$?
          grep -E "FAIL|✗|AssertionError|Error:" legacy-tests.log | head -80 || true
          tail -60 legacy-tests.log
          echo "::warning title=Legacy tests::exit code $code"
      - name: Production build (website + server)
        run: npm run build
      - name: Bot engine bundle (VM image)
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --packages=external --outfile=/tmp/vm-server.cjs
      - name: Server boots (smoke)
        shell: bash
        run: |
          APP_RUNTIME_MODE=DEVELOPMENT_SIMULATION NODE_ENV=development PORT=3999 timeout 40 node dist/server.cjs > boot.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3999/health/live && exit 0; sleep 1; done
          cat boot.log; exit 1

  deploy-config:
    # The VM updater and front door run unattended; check them before they can reach the bot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check updater script
        run: bash -n deploy/vm/update.sh && shellcheck -S error deploy/vm/update.sh
      - name: Check Caddy front door config
        run: docker run --rm -e PUBLIC_API_HOST=example.sslip.io -v "$PWD/deploy/vm/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      - name: Check compose file
        run: sudo mkdir -p /opt/community-manager && sudo touch /opt/community-manager/bot.env && docker compose -f deploy/vm/docker-compose.yml config -q
